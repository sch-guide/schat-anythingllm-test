<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SCHAT 저장 구조 ERD</title>
  <desc id="desc">사용자, 부서, 문서, 조각, 체크리스트, 퀴즈와 동의어의 관계</desc>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <defs><style>.box{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 18px sans-serif;fill:#0f172a}.t{font:14px sans-serif;fill:#475569}.l{stroke:#64748b;stroke-width:2;fill:none}.label{font:13px sans-serif;fill:#0f766e}</style></defs>
  <rect class="box" x="50" y="70" width="210" height="110" rx="14"/><text class="h" x="75" y="105">부서</text><text class="t" x="75" y="135">부서 ID · 이름 · 사용 여부</text>
  <rect class="box" x="50" y="250" width="210" height="120" rx="14"/><text class="h" x="75" y="285">사용자</text><text class="t" x="75" y="315">계정 ID · 부서 · 권한</text><text class="t" x="75" y="340">로그인 · 문제 신고</text>
  <rect class="box" x="380" y="55" width="250" height="135" rx="14"/><text class="h" x="405" y="90">문서</text><text class="t" x="405" y="120">document_id · 파일명 · 버전</text><text class="t" x="405" y="145">현재/이전 · 업로드 시각</text>
  <rect class="box" x="380" y="250" width="250" height="120" rx="14"/><text class="h" x="405" y="285">문서 조각</text><text class="t" x="405" y="315">vector ID · 쪽 · 목차</text><text class="t" x="405" y="340">본문 · embedding metadata</text>
  <rect class="box" x="770" y="45" width="260" height="110" rx="14"/><text class="h" x="795" y="80">체크리스트</text><text class="t" x="795" y="110">document_id · page · 항목</text>
  <rect class="box" x="770" y="205" width="260" height="110" rx="14"/><text class="h" x="795" y="240">퀴즈</text><text class="t" x="795" y="270">문서 · 문제 · 정답 · 출처</text>
  <rect class="box" x="770" y="365" width="260" height="110" rx="14"/><text class="h" x="795" y="400">동의어</text><text class="t" x="795" y="430">표준어 · 같은 뜻 · 상태</text>
  <path class="l" d="M155 180V250"/><text class="label" x="168" y="220">소속</text>
  <path class="l" d="M260 310H380"/><text class="label" x="290" y="298">등록·사용</text>
  <path class="l" d="M505 190V250"/><text class="label" x="518" y="225">1:N</text>
  <path class="l" d="M630 105H770"/><text class="label" x="666" y="93">원문 연결</text>
  <path class="l" d="M630 130C700 130 700 260 770 260"/><text class="label" x="670" y="205">출처 연결</text>
  <path class="l" d="M630 310C700 310 700 420 770 420"/><text class="label" x="662" y="375">검색 보완</text>
</svg>
